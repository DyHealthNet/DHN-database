version: '3.3'

services:
  postgres:
    container_name: dhn_db
    image: postgres:latest
    ports:
      - 9000:5432
    volumes:
      - DHNpostgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres

volumes:
  DHNpostgres:
