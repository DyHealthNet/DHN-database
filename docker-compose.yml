services:
  postgres:
    container_name: dhn_db
    image: postgres:16
    ports:
      - 9852:5432
    volumes:
      - DHNpostgres:/var/lib/postgresql/data
      - /tmp:/tmp
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres

volumes:
  DHNpostgres:
